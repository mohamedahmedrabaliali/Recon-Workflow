         -H 'priority: u=0, i' \
         -H 'referer: https://securitytrails.com/list/apex_domain/krazeplanet.com?page=1' \
         -H 'sec-ch-ua: "Chromium";v="146", "Not-A.Brand";v="24", "Google Chrome";v="146"' \
         -H 'sec-fetch-dest: document' \
         -H 'sec-fetch-mode: navigate' \
         -H 'sec-fetch-site: same-origin' \
         -H 'upgrade-insecure-requests: 1' \
         -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36'
         EOF

         echo "we will print the content of cookie.txt......"
         cat cookie.txt

############################################################
# Prepare the python script Results
############################################################

      - name: Prepare the python script 
        run: |
         
          cat << 'EOF' > python-script.txt
          import requests
          import json

          URL = "https://urlscan.io/api/v1/search/?q=domain%3A${DOMAIN}"

          def extract_details():
              try:
                  response = requests.get(URL)
                  response.raise_for_status()
                  data = response.json()
        
                  domains = set()
                  urls = set()
                  asns = set()
        
                  for result in data.get("results", []):
                      # Extract domain
                      page_domain = result.get("page", {}).get("domain")
                      if page_domain:
                          domains.add(page_domain)
            
                      # Extract URL containing 'chewy.com'
                      page_url = result.get("page", {}).get("url")
                      if page_url and "chewy.com" in page_url:
                          urls.add(page_url)
            
                      # Extract ASN
                      asn = result.get("page", {}).get("asn")
                      if asn:
                          asns.add(asn)

                  # Save domains to results.txt
                  with open("python-script-results.txt", "w") as f:
                      for domain in sorted(domains):
                          f.write(domain + "\\n")

                  print("Domains saved to pyhon-script-results.txt")

                  print("\\nURLs containing 'chewy.com':")
                  print("\\n".join(urls))

                  print("\\nASNs:")
                  print("\\n".join(map(str, asns)))

              except requests.RequestException as e:
                  print("Error fetching data:", e)

          if __name__ == "__main__":
              extract_details()
          EOF

          mv python-script.txt python-script.py
############################################################
# Download Base Wordlists  #DONE
############################################################

      - name: Download base wordlists
        run: |

          wget -O permutations.txt \
          https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt

          wget -O resolvers.txt \
          https://raw.githubusercontent.com/trickest/resolvers/main/resolvers.txt

############################################################
# Download Additional Permutation Lists  #DONE
############################################################

      - name: Download large permutation lists
        run: |

          wget -O sub1000.lst \
          https://raw.githubusercontent.com/ehsahil/wordlists-for-nmap/master/sub1000.lst

          wget -O sub10000.lst \
          https://raw.githubusercontent.com/ehsahil/wordlists-for-nmap/master/sub10000.lst

          wget -O sub100000.lst \
          https://raw.githubusercontent.com/ehsahil/wordlists-for-nmap/master/sub100000.lst

          wget -O sub1000000.lst \
          https://raw.githubusercontent.com/ehsahil/wordlists-for-nmap/master/sub1000000.lst

          wget -O seclists-110k.txt \
          https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-110000.txt

          wget --no-check-certificate \
          -O drive_list1.txt \
          "https://drive.google.com/uc?export=download&id=1mw7dclyjOr3Z7AXcqbP9o4Nw-iBAQBI0"

          wget --no-check-certificate \
          -O drive_list2.txt \
          "https://drive.google.com/uc?export=download&id=1cV-hToCWWXusIc-xzjU9fiigOg0AbfRt"

############################################################
# Merge Permutation Lists
############################################################

      - name: Merge and deduplicate permutation lists
        run: |

          cat permutations.txt \
          sub1000.lst \
          sub10000.lst \
          sub100000.lst \
          sub1000000.lst \
          seclists-110k.txt \
          drive_list1.txt \
          drive_list2.txt \
          | sed 's/\r//g' \
          | sort -u > mega-permutations.txt

############################################################
# Passive Enumeration
############################################################

      - name: Passive discovery
        run: |
          python3 python-script.py 
          
          cd SubEnum ; ./subenum.sh -d ${DOMAIN} -p -u wayback,crt,abuseipdb,Findomain,Subfinder,Amass,Assetfinder --silent -o subenum-result.txt &
          subfinder -d $DOMAIN -silent > subfinder.txt &
          assetfinder --subs-only $DOMAIN > assetfinder.txt &
          chaos -d $DOMAIN -silent > chaos.txt &
          echo $DOMAIN | subdog --silent > subdog.txt &
          echo $DOMAIN | certinfo -silent > certinfo.txt &
          subscraper -d $DOMAIN -silent > subscraper.txt &
          echo ${DOMAIN} | haktrailsfree -c cookie.txt  --silent > haktrailsfree-result.txt &
          
          github-subdomains -d $DOMAIN -e -k -o github.txt &
          wait

############################################################
# Certificate Transparency Discovery    #DONE
############################################################

      - name: Certificate Transparency discovery
        run: |

          echo "Searching Certificate Transparency logs for: ${DOMAIN}"
          
          # Add retry logic with user-agent to avoid rate limiting
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES"
            
            curl -s \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --max-time 30 \
              "https://crt.sh/?q=%25.${DOMAIN}&output=json" \
              | jq -r '.[].name_value' 2>/dev/null \
              | sed 's/\*\.//g' \
              | sort -u > crtsh.txt
            
            # Check if we got results
            RESULT_COUNT=$(wc -l < crtsh.txt)
            
            if [ "$RESULT_COUNT" -gt 0 ]; then
              echo "✓ Success! Found $RESULT_COUNT certificates"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "No results, retrying in 5 seconds..."
                sleep 5
              fi
            fi
          done
          
          FINAL_COUNT=$(wc -l < crtsh.txt)
          echo "Final result: $FINAL_COUNT certificates found"
          [ "$FINAL_COUNT" -gt 0 ] && head -5 crtsh.txt || echo "No certificates found"
          
############################################################
# Display all results
############################################################

      - name: Display all results
        run: |
          echo "=== Subfinder Results ==="
          [ -f subfinder.txt ] && wc -l subfinder.txt && head -5 subfinder.txt || echo "File not found"

          echo -e "\n=== Assetfinder Results ==="
          [ -f assetfinder.txt ] && wc -l assetfinder.txt && head -5 assetfinder.txt || echo "File not found"

          echo -e "\n=== Chaos Results ==="
          [ -f chaos.txt ] && wc -l chaos.txt && head -5 chaos.txt || echo "File not found"

          echo -e "\n=== Subdog Results ==="
          [ -f subdog.txt ] && wc -l subdog.txt && head -5 subdog.txt || echo "File not found"

          echo -e "\n=== Certinfo Results ==="
          [ -f certinfo.txt ] && wc -l certinfo.txt && head -5 certinfo.txt || echo "File not found"

          echo -e "\n=== Subscraper Results ==="
          [ -f subscraper.txt ] && wc -l subscraper.txt && head -5 subscraper.txt || echo "File not found"

          echo -e "\n=== GitHub Subdomains Results ==="
          [ -f github.txt ] && wc -l github.txt && head -5 github.txt || echo "File not found"

          echo -e "\n=== Certificate Transparency Results ==="
          [ -f crtsh.txt ] && wc -l crtsh.txt && head -5 crtsh.txt || echo "File not found"

          echo -e "\n=== Haktrailsfree Results ==="
          [ -f haktrailsfree-result.txt ] && wc -l haktrailsfree-result.txt && head -5 haktrailsfree-result.txt || echo "File not found"
          
          echo -e "\n=== The Python Script Results ==="
          [ -f pyhon-script-results.txt ] && wc -l pyhon-script-results.txt && head -5 pyhon-script-results.txt || echo "File not found"

          echo -e "\n=== Subenum Results ==="
          [ -f subenum-result.txt ] && wc -l subenum-result.txt && head -5 subenum-result.txt || echo "File not found"
          
############################################################
# Merge Passive Results
############################################################

      - name: Merge passive
        run: |
          cat subenum-result.txt subfinder.txt assetfinder.txt chaos.txt subdog.txt certinfo.txt subscraper.txt pyhon-script-results.txt haktrailsfree-result.txt github.txt crtsh.txt \
          | grep -v '\*' | sort -u > passive.txt
          
############################################################
# Recursive Enumeration
############################################################

      - name: Recursive discovery
        run: |
        
          while read domain; do
            subfinder -d "$domain" -recursive -silent
          done < passive.txt > recursive.txt

############################################################
# Filter and enrich a list of subdomains by level
############################################################

      - name: Filter and enrich a list of subdomains by level
        run: |

          dsieve -if recursive.txt > dsieve-result.txt

############################################################
# Merge Domains
############################################################

      - name: Merge domains
        run: |
          cat passive.txt recursive.txt dsieve-result.txt| sort -u > domains.txt

############################################################
# Permutation Generation
############################################################

      - name: AlterX permutations
        run: |
          cat domains.txt | alterx -enrich > alterx.txt

      - name: Gotator permutations
        run: |

          gotator -sub domains.txt -perm mega-permutations.txt -depth 1 -numbers 10 -mindup -adv -md > depth1.txt
          gotator -sub domains.txt -perm mega-permutations.txt -depth 2 -numbers 10 -mindup -adv -md > depth2.txt

      - name: DNSGen permutations
        run: |
          dnsgen domains.txt > dnsgen.txt

############################################################
# Merge Permutations
############################################################

      - name: Merge permutation sources
        run: |

          cat alterx.txt depth1.txt depth2.txt dnsgen.txt \
          | sort -u > permutations-final.txt

############################################################
# Massive DNS Resolution
############################################################

      - name: ShuffleDNS bruteforce
        run: |

          shuffledns \
          -d $DOMAIN \
          -list permutations-final.txt \
          -r resolvers.txt \
          -mode bruteforce \
          -massdns /usr/local/bin/massdns \
          -silent \
          -o shuffledns.txt

############################################################
# PureDNS Filtering
############################################################

      - name: PureDNS filtering
        run: |

          puredns resolve shuffledns.txt \
          --resolvers resolvers.txt \
          --write puredns-output.txt

############################################################
# DNS Validation
############################################################

      - name: DNS validation
        run: |
          dnsx -l puredns-output.txt -silent > resolved.txt

############################################################
# HTTP Probing
############################################################

      - name: HTTP probing
        run: |
          httpx -l resolved.txt -title -status-code -tech-detect -silent > live.txt

############################################################
# Extract Alive URLs
############################################################

      - name: Extract alive URLs
        run: |
          cat live.txt | awk '{print $1}' > alivesubs.txt


############################################################
# Generate FUZZ Patterns
############################################################

      - name: Generate subdomain fuzz patterns
        run: |

          cat alivesubs.txt \
          | subdomainfuzz -silent -d $DOMAIN -payload FUZZ \
          | sort -u > fuzz_patterns.txt

############################################################
# Prepare Fuzz Targets
############################################################

      - name: Prepare fuzz targets
        run: |

          while read pattern; do
            while read word; do
              echo "${pattern/FUZZ/$word}"
            done < permutations-final.txt
          done < fuzz_patterns.txt \
          | sort -u > fuzz_targets.txt

############################################################
# FFUF Bruteforce
############################################################

      - name: FFUF brute force
        run: |

          cat fuzz_patterns.txt | while read url; do
            ffuf -u "$url" -w permutations-final.txt -mc 200,301,302,403 -t 100 -of csv >> ffuf_results.csv
          done

############################################################
# Extract FFUF Domains
############################################################

      - name: Extract ffuf domains
        run: |

          cat ffuf_results.csv \
          | cut -d',' -f1 \
          | sed 's|https://||' \
          | sed 's|http://||' \
          | cut -d'/' -f1 \
          | sort -u > ffuf_domains.txt

############################################################
# Merge FFUF Discoveries
############################################################

      - name: Merge ffuf discoveries
        run: |
          cat resolved.txt ffuf_domains.txt | sort -u > final-domains.txt

############################################################
# Final PureDNS Filtering
############################################################

      - name: Final PureDNS filtering
        run: |

          puredns resolve final-domains.txt \
          --resolvers resolvers.txt \
          --write final-domains.txt

############################################################
# Discord Notification
############################################################

      - name: Discord notification
        run: |

          TOTAL=$(wc -l < final-domains.txt)

          MESSAGE="Recon finished for **$DOMAIN** - Live Subdomains: **$TOTAL**"

          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\":\"$MESSAGE\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
